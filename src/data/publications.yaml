  abstract: "The world faces overlapping crises of global scale and consequence. Given limited attention and capacity, which crises garner attention and framing as important? Which are neglected in ways reflective of broader, systemic concerns that challenge established institutional arrangements? Here, we place gender inequality, a key topic raised by Japanese governmental and non-governmental organizations, in conversation with national level open-response survey data from over 30,000 Japanese participants, collected in March 2020. Using a combination of automated text analysis, manual keyword curation, and discourse analysis, we reveal how expressions of abiding social concern are articulated throughout Japan. We found that the most frequent issue raised was shōshi kōreika (low birth rate, aging population), while phrases related to ‘gender inequality’ were sparse. A subsequent discourse analysis of the open-ended survey responses revealed distress and broader anxiety around gender disparities folded into the phrase shōshi kōreika. We conclude, then, that shōshi kōreika operates as a macro-level ‘idiom of distress,’ a shorthand capturing a dissatisfaction with gender inequality. The significance of this is twofold: (1) it offers insight into how collective concerns are expressed or obscured within dominant narratives of crisis; and (2) it suggests the absence of a national level of concern for gender inequality that is nevertheless complexly embedded in many aspects of daily life."
  keywords:
    - gender
    - Japan
    - demographic decline
    - idiom of distress
