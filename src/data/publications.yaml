  abstract: How does the age composition of democratic institutions shape public evaluations of their legitimacy? While most institutions are dominated by older politicians, we argue that incorporating younger representatives can enhance perceptions of legitimacy. To test this claim, we conduct a survey experiment in the United States that varies the age composition of a bipartisan state legislative committee and its decisions. We find that including younger members increases perceptions of procedural fairness and institutional trust, and improves evaluations of decisions on lower-salience policies. These effects are stronger among young people and Democrats. Evidence on mechanisms suggests these legitimacy gains reflect beliefs that younger politicians are more attuned to young people’s experiences and concerns. Observational evidence from U.S. state legislatures and a replication experiment in the United Kingdom yield consistent patterns, suggesting that these findings extend beyond the original experimental context. This suggests that expanding youth representation can meaningfully strengthen democratic legitimacy.
